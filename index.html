<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Regalo para ti</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>
    let imgNebulosa, imgYo, imgCorazon, imgElla;
    let corazones = [], objetivos = [];
    let vidas = 5, puntos = 0, record = 0, estado = "JUGANDO";

    function preload() {
        imgNebulosa = loadImage('assets/nebulosa.jpg');
        imgYo = loadImage('assets/yo.jpg');
        imgCorazon = loadImage('assets/corazon.png');
        imgElla = loadImage('assets/ella.jpg');
    }

    function setup() {
        createCanvas(windowWidth, windowHeight);
        for (let i = 0; i < 2; i++) crearObjetivo();
    }

    function crearObjetivo() {
        objetivos.push({ x: random(50, width - 50), y: random(-200, -50), speed: 1.5, vida: 3, alpha: 255 });
    }

    function draw() {
        background(imgNebulosa);

        if (estado === "JUGANDO") {
            // Jugador
            image(imgYo, mouseX - 40, height - 150, 80, 80);

            // Objetivos
            for (let i = objetivos.length - 1; i >= 0; i--) {
                let obj = objetivos[i];
                obj.y += obj.speed;
                tint(255, obj.alpha);
                image(imgElla, obj.x, obj.y, 70, 70);
                noTint();

                if (obj.y > height) {
                    vidas--;
                    objetivos.splice(i, 1);
                    crearObjetivo();
                    if (vidas <= 0) estado = "PERDIDO";
                }
            }

            // Corazones
            for (let i = corazones.length - 1; i >= 0; i--) {
                let c = corazones[i];
                c.y -= 10;
                image(imgCorazon, c.x, c.y, 40, 40);

                for (let j = objetivos.length - 1; j >= 0; j--) {
                    let obj = objetivos[j];
                    if (dist(c.x, c.y, obj.x + 35, obj.y + 35) < 40) {
                        obj.vida--;
                        obj.alpha -= 85;
                        corazones.splice(i, 1);
                        if (obj.vida <= 0) {
                            puntos++;
                            if (puntos > record) record = puntos;
                            objetivos.splice(j, 1);
                            crearObjetivo();
                        }
                        break;
                    }
                }
                if (c.y < 0) corazones.splice(i, 1);
            }

            // UI
            fill(255); textSize(20);
            text("Vidas: " + vidas + " | Puntos: " + puntos + " | Récord: " + record, 20, 30);
        } else {
            // Pantalla de Perder
            fill(255, 0, 0); textSize(50); textAlign(CENTER, CENTER);
            text("¡PERDISTE mi amor :(!", width/2, height/2 - 30);
            fill(255); textSize(20);
            text("Toca la pantalla para intentar de nuevo", width/2, height/2 + 30);
        }
    }

    function mousePressed() {
        if (estado === "PERDIDO") {
            vidas = 5; puntos = 0; estado = "JUGANDO";
            objetivos = [];
            for (let i = 0; i < 2; i++) crearObjetivo();
        } else {
            corazones.push({ x: mouseX, y: height - 150 });
        }
        return false;
    }

    function touchStarted() {
        return mousePressed();
    }
    
</script>
</body>
</html>
